plugins { id 'com.android.application' }

android {
    namespace 'com.mp3lab.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.mp3lab.app'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.2.2'
        ndk { abiFilters 'arm64-v8a' }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    if (System.getenv('MP3_LAB_KEYSTORE')) {
        signingConfigs {
            preview {
                storeFile file(System.getenv('MP3_LAB_KEYSTORE'))
                storeType 'PKCS12'
                storePassword System.getenv('MP3_LAB_KEYSTORE_PASSWORD')
                keyAlias 'mp3lab'
                keyPassword System.getenv('MP3_LAB_KEYSTORE_PASSWORD')
            }
        }
        if (!project.hasProperty('qa')) { buildTypes { debug { signingConfig signingConfigs.preview } } }
    }
    if (project.hasProperty('qa')) {
        buildTypes { debug { applicationIdSuffix '.qa' } }
    }
}

dependencies {
    implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-audio:8.1.9'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
