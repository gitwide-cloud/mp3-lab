name: Build and publish MP3 Lab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mp3-lab-release
  cancel-in-progress: false

jobs:
  desktop:
    name: Desktop build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: mp3-lab-windows
          - os: ubuntu-24.04
            artifact: mp3-lab-linux
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg build-essential pkg-config zip libgtk-3-dev libxkbcommon-dev libwayland-dev libasound2-dev libudev-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev libgl1-mesa-dev
      - name: Build Rust release
        run: cargo test --locked --release
      - name: Build Rust release binary
        run: cargo build --locked --release
      - name: Verify audio export with FFmpeg
        if: runner.os == 'Linux'
        run: cargo test --locked --release -- --include-ignored
      - name: Package executable and dependency licenses
        run: python ../tools/package_desktop.py ${{ runner.os == 'Windows' && 'windows' || 'linux' }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error

  android:
    name: Android ARM64 APK
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile Android APK
        run: |
          python ../tools/prepare_android_sources.py
          gradle :app:assembleDebug :app:assembleDebugAndroidTest lintDebug --stacktrace
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ../mp3-lab.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mp3-lab-android
          path: mp3-lab.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: mp3-lab-android-sources
          path: dist/android-third-party-sources.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release after all builds pass
    runs-on: ubuntu-24.04
    needs: [desktop, android]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: mp3-lab-*
          merge-multiple: true
          path: dist
      - name: Verify all three downloads
        run: |
          test -s dist/mp3-lab-windows.zip
          test -s dist/mp3-lab-linux.zip
          test -s dist/mp3-lab.apk
          test -s dist/android-third-party-sources.zip
          cp THIRD_PARTY_NOTICES.md dist/
          cd dist
          sha256sum *.zip *.apk THIRD_PARTY_NOTICES.md > SHA256SUMS.txt
          cd ..
          ls -lh dist
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "v0.1.0-preview.${{ github.run_number }}" dist/* \
            --target "${{ github.sha }}" --title "mp3⚡lab v0.1.0 preview ${{ github.run_number }}" --prerelease \
            --notes "Windows and Linux desktop ZIPs, Android ARM64 APK, dependency notices and corresponding Android dependency sources. Desktop requires separately installed ffmpeg, ffprobe and ffplay. Rust tests and Linux FFmpeg export smoke test run in CI; Android compiles and passes lint. Android is debug-signed for sideloading; future builds may require uninstalling a preview with a different key. See README for device validation and limitations. Verify downloads with SHA256SUMS.txt."
