name: Build and publish MP3 Lab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: mp3-lab-release
  cancel-in-progress: false

jobs:
  desktop:
    name: Desktop build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: mp3-lab-windows
          - os: ubuntu-24.04
            artifact: mp3-lab-linux
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth ffmpeg build-essential pkg-config zip libgtk-3-dev libxkbcommon-x11-0 libxkbcommon-dev libwayland-dev libasound2-dev libudev-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev libgl1-mesa-dev
      - name: Build Rust release
        run: cargo test --locked --release
      - name: Build Rust release binary
        run: cargo build --locked --release
      - name: Verify audio export with FFmpeg
        if: runner.os == 'Linux'
        run: cargo test --locked --release -- --include-ignored
      - name: Capture desktop skin with real audio fixture
        if: runner.os == 'Linux'
        run: |
          ffmpeg -y -f lavfi -i 'aevalsrc=0.6*sin(440*2*PI*t)*(0.15+0.85*sin(PI*t/20)*sin(PI*t/20)):s=48000:d=20' /tmp/Skin-check.wav
          timeout 40s xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 MP3_LAB_DEMO=/tmp/Skin-check.wav MP3_LAB_SCREENSHOT=../desktop-skin.png target/release/mp3-lab
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: mp3-lab-skin-preview
          path: desktop-skin.png
      - name: Retrieve matching source-built Windows audio tools
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ../tools/download_windows_runtime.py
      - name: Embed supplied Windows icon
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe -OutFile "$env:RUNNER_TEMP/rcedit.exe"
          & "$env:RUNNER_TEMP/rcedit.exe" target/release/mp3-lab.exe --set-icon ../assets/mp3-lab.ico --set-file-version 0.2.0 --set-product-version 0.2.0
          if ($LASTEXITCODE -ne 0) { throw 'Icon embedding failed' }
      - name: Package executable and dependency licenses
        run: python ../tools/package_desktop.py ${{ runner.os == 'Windows' && 'windows' || 'linux' }}
      - name: Build and verify complete Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python ../tools/verify_windows_package.py ../windows-package
          if ($LASTEXITCODE -ne 0) { throw 'Portable package test failed' }
          $compiler = Get-ChildItem 'C:/Program Files (x86)/Inno Setup*/ISCC.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$compiler) {
            choco install innosetup --yes --no-progress
            $compiler = Get-ChildItem 'C:/Program Files (x86)/Inno Setup*/ISCC.exe' | Select-Object -First 1
          }
          & $compiler.FullName ../tools/windows-installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          $installDir = Join-Path $env:RUNNER_TEMP 'MP3 Lab Install Test'
          $setup = Start-Process -FilePath ../mp3-lab-setup.exe -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$installDir`"") -Wait -PassThru -WindowStyle Hidden
          if ($setup.ExitCode -ne 0) { throw 'Silent install failed' }
          python ../tools/verify_windows_package.py "$installDir"
          if ($LASTEXITCODE -ne 0) { throw 'Installed package test failed' }
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: mp3-lab-windows-setup
          path: mp3-lab-setup.exe
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: mp3-lab-windows-audio-sources
          path: dist/windows-audio-sources.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error

  android:
    name: Android ARM64 APK
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile Android APK
        run: |
          python ../tools/prepare_android_sources.py
          gradle :app:assembleDebug :app:assembleDebugAndroidTest lintDebug --stacktrace
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ../mp3-lab.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mp3-lab-android
          path: mp3-lab.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: mp3-lab-android-sources
          path: dist/android-third-party-sources.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release after all builds pass
    runs-on: ubuntu-24.04
    needs: [desktop, android]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: mp3-lab-*
          merge-multiple: true
          path: dist
      - name: Verify all three downloads
        run: |
          test -s dist/mp3-lab-windows.zip
          test -s dist/mp3-lab-linux.zip
          test -s dist/mp3-lab.apk
          test -s dist/mp3-lab-setup.exe
          test -s dist/windows-audio-sources.tar.gz
          test -s dist/android-third-party-sources.zip
          cp THIRD_PARTY_NOTICES.md dist/
          cp assets/screenshots/android.png dist/android-skin.png
          cd dist
          sha256sum *.zip *.apk *.exe *.tar.gz *.png THIRD_PARTY_NOTICES.md > SHA256SUMS.txt
          cd ..
          ls -lh dist
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "v0.2.0-preview.${{ github.run_number }}" dist/* \
            --target "${{ github.sha }}" --title "mp3⚡lab v0.2.0 preview ${{ github.run_number }}" --prerelease \
            --notes "Reference-inspired metallic player skin, real waveform and supplied app icon. Windows installer and portable ZIP include FFmpeg, FFprobe and FFplay; no separate audio-tool installation required. Windows portable and installed audio tools are tested with a system-only PATH. Linux ZIP requires system FFmpeg and desktop libraries. Rust tests, audio export tests, desktop screenshot check and Android lint pass in CI. Android ARM64 is debug-signed for sideloading; updates may require uninstalling a preview with a different key. Dependency notices and corresponding audio sources are included. Verify downloads with SHA256SUMS.txt."
